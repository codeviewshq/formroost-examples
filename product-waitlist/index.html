<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Join the waitlist — Product Launch Starter</title>
    <!-- Tailwind's browser build is for prototypes. Use the Tailwind CLI for production. -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.5"></script>
    <style type="text/tailwindcss">
      [data-tone='success'] { @apply bg-emerald-50 text-emerald-900 ring-emerald-200; }
      [data-tone='error'] { @apply bg-red-50 text-red-900 ring-red-200; }
      [data-tone='info'] { @apply bg-slate-50 text-slate-700 ring-slate-200; }
      [aria-invalid='true'] { @apply border-red-500 ring-red-500; }
    </style>
  </head>
  <body class="flex min-h-screen items-center justify-center bg-slate-50 px-4 py-16 text-slate-900 antialiased">
    <main class="w-full max-w-md rounded-2xl bg-white p-8 shadow-sm ring-1 ring-slate-200">
      <span class="inline-block rounded-full bg-orange-50 px-3 py-1 text-xs font-medium text-orange-700 ring-1 ring-orange-200">
        Early access
      </span>
      <h1 class="mt-4 text-2xl font-semibold tracking-tight">Join the launch waitlist</h1>
      <p class="mt-2 text-sm text-slate-600">
        Leave your email and we will send an invite as soon as spots open.
      </p>

      <!-- Replace fpub_REPLACE_ME with your FormRoost sandbox ID. Switch to /production/ after publishing. -->
      <form
        data-formroost
        action="https://formroost.com/s/v1/sandbox/fpub_REPLACE_ME"
        method="post"
        class="mt-7 space-y-4"
      >
        <div>
          <label for="name" class="block text-sm font-medium">First name (optional)</label>
          <input id="name" name="name" autocomplete="given-name"
            class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-orange-500 focus:ring-2 focus:ring-orange-500/30 focus:outline-none" />
          <p data-error-for="name" class="mt-1 text-sm text-red-700"></p>
        </div>

        <div>
          <label for="email" class="block text-sm font-medium">Email</label>
          <input id="email" name="email" type="email" required autocomplete="email" placeholder="you@example.com"
            class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-orange-500 focus:ring-2 focus:ring-orange-500/30 focus:outline-none" />
          <p data-error-for="email" class="mt-1 text-sm text-red-700"></p>
        </div>

        <!-- Anti-spam: honeypot (hidden from people) and render timestamp. -->
        <div class="absolute -left-[9999px] h-px w-px overflow-hidden" aria-hidden="true">
          <label for="_gotcha">Leave this field empty</label>
          <input id="_gotcha" name="_gotcha" type="text" tabindex="-1" autocomplete="off" />
        </div>
        <input type="hidden" name="_fr_started_at" />

        <button type="submit"
          class="w-full rounded-lg bg-orange-600 px-4 py-2.5 font-medium text-white hover:bg-orange-700 disabled:opacity-60">
          Join waitlist
        </button>
        <p data-status role="status" aria-live="polite" hidden class="rounded-lg px-3 py-2 text-sm ring-1"></p>
      </form>
    </main>
    <script src="formroost.js" defer></script>
  </body>
</html>
