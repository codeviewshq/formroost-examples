<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Book an intro call — Coach &amp; Consultant Starter</title>
    <!-- Tailwind's browser build is for prototypes. Use the Tailwind CLI for production. -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.5"></script>
    <style type="text/tailwindcss">
      [data-tone='success'] { @apply bg-emerald-50 text-emerald-900 ring-emerald-200; }
      [data-tone='error'] { @apply bg-red-50 text-red-900 ring-red-200; }
      [data-tone='info'] { @apply bg-slate-50 text-slate-700 ring-slate-200; }
      [aria-invalid='true'] { @apply border-red-500 ring-red-500; }
    </style>
  </head>
  <body class="min-h-screen bg-neutral-950 px-4 py-14 text-neutral-100 antialiased">
    <main class="mx-auto max-w-xl rounded-2xl border border-neutral-800 bg-neutral-900 p-8 shadow-xl">
      <p class="text-xs font-semibold tracking-wider text-orange-400 uppercase">Discovery call</p>
      <h1 class="mt-2 text-2xl font-semibold tracking-tight">Book a 20-minute intro call</h1>
      <p class="mt-2 text-sm text-neutral-400">
        Share what you are working on and your preferred window. I will reply with calendar times.
      </p>

      <!-- Replace fpub_REPLACE_ME with your FormRoost sandbox ID. Switch to /production/ after publishing. -->
      <form
        data-formroost
        action="https://formroost.com/s/v1/sandbox/fpub_REPLACE_ME"
        method="post"
        class="mt-8 space-y-5"
      >
        <div>
          <label for="name" class="block text-sm font-medium text-neutral-200">Name</label>
          <input id="name" name="name" required autocomplete="name"
            class="mt-1 block w-full rounded-lg border border-neutral-700 bg-neutral-950 px-3 py-2 text-white focus:border-orange-500 focus:ring-2 focus:ring-orange-500/30 focus:outline-none" />
          <p data-error-for="name" class="mt-1 text-sm text-red-400"></p>
        </div>

        <div>
          <label for="email" class="block text-sm font-medium text-neutral-200">Email</label>
          <input id="email" name="email" type="email" required autocomplete="email"
            class="mt-1 block w-full rounded-lg border border-neutral-700 bg-neutral-950 px-3 py-2 text-white focus:border-orange-500 focus:ring-2 focus:ring-orange-500/30 focus:outline-none" />
          <p data-error-for="email" class="mt-1 text-sm text-red-400"></p>
        </div>

        <div>
          <label for="timeframe" class="block text-sm font-medium text-neutral-200">Best time to talk</label>
          <select id="timeframe" name="timeframe"
            class="mt-1 block w-full rounded-lg border border-neutral-700 bg-neutral-950 px-3 py-2 text-white focus:border-orange-500 focus:ring-2 focus:ring-orange-500/30 focus:outline-none">
            <option value="morning">Weekday mornings</option>
            <option value="afternoon">Weekday afternoons</option>
            <option value="flexible">Flexible</option>
          </select>
          <p data-error-for="timeframe" class="mt-1 text-sm text-red-400"></p>
        </div>

        <div>
          <label for="goal" class="block text-sm font-medium text-neutral-200">What would you like help with?</label>
          <textarea id="goal" name="goal" rows="4" required
            class="mt-1 block w-full rounded-lg border border-neutral-700 bg-neutral-950 px-3 py-2 text-white focus:border-orange-500 focus:ring-2 focus:ring-orange-500/30 focus:outline-none"></textarea>
          <p data-error-for="goal" class="mt-1 text-sm text-red-400"></p>
        </div>

        <!-- Anti-spam: honeypot (hidden from people) and render timestamp. -->
        <div class="absolute -left-[9999px] h-px w-px overflow-hidden" aria-hidden="true">
          <label for="_gotcha">Leave this field empty</label>
          <input id="_gotcha" name="_gotcha" type="text" tabindex="-1" autocomplete="off" />
        </div>
        <input type="hidden" name="_fr_started_at" />

        <button type="submit"
          class="w-full rounded-lg bg-orange-600 px-4 py-2.5 font-medium text-white hover:bg-orange-500 disabled:opacity-60">
          Request intro call
        </button>
        <p data-status role="status" aria-live="polite" hidden class="rounded-lg px-3 py-2 text-sm ring-1"></p>
      </form>
    </main>
    <script src="formroost.js" defer></script>
  </body>
</html>
